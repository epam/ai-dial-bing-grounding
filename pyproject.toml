[project]
name = "aidial-bing-grounding"
version = "0.0.1"
description = "Integration with Azure AI Agent with Bing Search Grounding"
authors = [
    { name = "DIAL Dev Team", email = "EPAM RAIL <SpecialEPM-DIALDevTeam@epam.com>" },
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
homepage = "https://epam-rail.com"
documentation = "https://epam-rail.com/dial_api"
license = "Apache-2.0"
keywords = ["ai"]
classifiers = ["Topic :: Software Development :: Libraries :: Python Modules"]
repository = "https://gitlab.deltixhub.com/Deltix/openai-apps/ai-dial-python-project-template.git"
dependencies = [
    "fastapi (>=0.115.13,<0.116.0)",
    "uvicorn (>=0.23.2,<0.24.0)",
    "pydantic (>=1.10.17,<1.11.0)",
    "aidial-sdk[telemetry] (>=0.22.1,<0.23.0)",
    "azure-ai-agents (>=1.0.2,<1.1.0)",
    "azure-ai-projects (>=1.0.0,<1.1.0)",
    "azure-identity (==1.23.0)",
    "aiohttp (>=3.11.16,<4.0.0)",
]

[tool.poetry]
package-mode = false
requires-poetry = '>=2.0.0,<3.0.0'

[tool.poetry.group.test.dependencies]
pytest = "^7.4.2"
pytest-asyncio = "^0.21.1"
pytest-dotenv = "^0.5.2"
pytest-xdist = "^3.5.0"
pytest-html = "^4.1.1"
pytest-sugar = "^1.0.0"
allure-pytest = "^2.13.5"
requests = "^2.31.0"
httpx = "^0.25.0"
respx = "^0.22.0"
openai = "^1.72.0"
pytest-timeout = "^2.3.1"

[tool.poetry.group.lint.dependencies]
flake8 = "^6.0.0"
black = { version = "^23.3.0", extras = ["jupyter"] }
isort = "^5.12.0"
pyright = "^1.1.399"
autoflake = "^2.2.0"

[tool.poetry.group.dev.dependencies]
nox = "^2023.4.22"
python-dotenv = "^1.0.0"

[tool.pytest.ini_options]
addopts = "-n=auto --asyncio-mode=auto --self-contained-html --html=pytest.html --alluredir=allure-results --doctest-modules --timeout=60"
generate_report_on_test = true
env_override_existing_values = 1
# FIXME: figure out where does `Unclosed client session` error come from
# filterwarnings = ["error"]

[tool.pyright]
typeCheckingMode = "basic"
reportUnusedVariable = "error"
reportIncompatibleMethodOverride = "error"
exclude = [".git", ".venv", ".nox", "**/__pycache__", "allure-results"]

[tool.black]
line-length = 80
exclude = '''
/(
    \.git
    | \.venv
    | \.nox
    | \.__pycache__
    | allure-results
)/
'''

[tool.isort]
line_length = 80
profile = "black"

[tool.autoflake]
ignore_init_module_imports = true
remove_all_unused_imports = true
in_place = true
recursive = true
quiet = true
exclude = ["\\.venv", "\\.nox", "allure-results"]
